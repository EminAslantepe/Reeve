<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0b0b; }
  /* Panel ayracı: panolar arasında 0.5 px boşluk bırakıyoruz, altından host görünüyor. */
  #host { position: absolute; inset: 0; background: #2b2b2b; }
  /* Her oturum kendi katmanında. Gizlemek için display:none DEĞİL visibility
     kullanıyoruz: display:none eleman boyutunu sıfırlar, o zaman ne term.open()
     doğru kurulur ne de fit() ölçebilir (UI.md D2). visibility:hidden ölçüyü korur. */
  .pane {
    position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
    box-sizing: border-box; background: #0b0b0b;
  }
  /* Kenar boşluğu panoya padding olarak VERİLEMİYOR: FitAddon ölçtüğü ebeveynin
     yüksekliğini padding'i düşmeden okuyor (WebKit border-box değerini
     döndürüyor), bir satır fazla hesaplayıp sonuncuyu panonun dışına taşırıyordu.
     Boşluğu konumlandırmayla veriyoruz; ölçülen kutu = gerçekten kullanılabilir alan. */
  .pane > .inner { position: absolute; top: 6px; bottom: 6px; left: 8px; right: 8px; }
  .pane[data-active="0"] { visibility: hidden; }
  .xterm-viewport::-webkit-scrollbar { width: 6px; }
  .xterm-viewport::-webkit-scrollbar-thumb { background: #2b2b2b; border-radius: 5px; }
  .xterm-viewport::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="host"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-search.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script>
(function () {
  "use strict";

  const host = document.getElementById("host");
  const panes = new Map();   // id -> { term, fit, search, el, webgl, cols, rows }
  let activeID = null;
  let layout = [null];       // görünür slotlardaki oturum kimlikleri

  const send = (name, body) => {
    const h = window.webkit && window.webkit.messageHandlers;
    if (h && h[name]) h[name].postMessage(body);
  };

  const encoder = new TextEncoder();
  const toB64 = (bytes) => {
    let s = "";
    for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s);
  };
  const fromB64 = (b64) => {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };

  const OPTIONS = {
    fontFamily: '"SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
    fontSize: 11,
    lineHeight: 1.35,
    cursorBlink: true,
    scrollback: 10000,
    // xterm'in varsayılanı 1: her tekerlek olayı tek satır, trackpad'de
    // ağır kalıyor. 3'ten %30 artırıldı. Alt basılıyken devreye giren
    // fastScrollSensitivity (5) varsayılanında bırakıldı.
    scrollSensitivity: 3.9,
    macOptionIsMeta: true,
    allowProposedApi: true,
    // Nötr yüzeyler Theme.swift ile eşleşir; ANSI durum renkleri korunur.
    theme: {
      background: '#0b0b0b', foreground: '#ececec',
      cursor: '#cccccc', cursorAccent: '#0b0b0b',
      selectionBackground: '#303030',
      black: '#0b0b0b',   red: '#ef6a5e',   green: '#6fcf97', yellow: '#e8b04a',
      blue: '#7aa7ff',    magenta: '#c99bf5', cyan: '#6fd3cf', white: '#ececec',
      brightBlack: '#6e6e7c', brightRed: '#ff8a7e', brightGreen: '#8fe0b3',
      brightYellow: '#f5c76a', brightBlue: '#9dbcff', brightMagenta: '#dcb6ff',
      brightCyan: '#8fe3df', brightWhite: '#ffffff'
    }
  };

  // WebGL bağlamı tarayıcı başına sınırlı (~16). Her oturuma bir tane açarsak
  // tükenir; bu yüzden yalnızca görünür olana veriyoruz, geçişte devrediyoruz.
  function attachWebgl(rec) {
    if (rec.webgl) return;
    try {
      const w = new WebglAddon.WebglAddon();
      w.onContextLoss(() => { w.dispose(); rec.webgl = null; });
      rec.term.loadAddon(w);
      rec.webgl = w;
    } catch (e) { rec.webgl = null; }
  }
  function detachWebgl(rec) {
    if (!rec.webgl) return;
    try { rec.webgl.dispose(); } catch (e) {}
    rec.webgl = null;
  }

  function reportSize(id, rec) {
    if (rec.term.cols === rec.cols && rec.term.rows === rec.rows) return false;
    rec.cols = rec.term.cols;
    rec.rows = rec.term.rows;
    send("resize", { id: id, cols: rec.cols, rows: rec.rows });
    return true;
  }

  // ---- Terminaldeki dosya yolları ----
  //
  // Claude çıktısında sürekli `Sources/Reeve/UI/Theme.swift:43` gibi yollar
  // geçiyor; tıklanınca sağdaki görüntüleyicide o satırda açılsınlar.
  //
  // Altını çizmeden önce Swift'e "bu dosya gerçekten var mı" diye soruyoruz.
  // Terminalde dosya adına BENZEYEN bir sürü şey geçiyor ("Faz 1.5", "2.1");
  // hepsini link yapmak arayüzü çöpe çevirirdi. Cevaplar pano başına
  // önbellekte, yoksa her fare hareketinde Swift'e gidilirdi.

  // Link yalnızca ⌘ basılıyken canlanıyor — editörlerdeki alışkanlık. Çıplak
  // tıklama terminalin kendisine kalıyor: metin seçmek ve TUI'ye tıklamak
  // bozulmuyor (xterm tıklamayı engellemiyor, sadece `activate` çağırıyor).
  //
  // Altı çizgiyi anlık açıp kapatabiliyoruz: xterm bir link hover edilince onun
  // `decorations` nesnesini setter'lı bir nesneyle değiştiriyor; ona yazmak
  // görünümü hemen günceller. Bu yüzden yalnızca hover edilen linke dokunuyoruz.
  let metaHeld = false;
  let hoveredLink = null;

  function setMeta(on) {
    if (metaHeld === on) return;
    metaHeld = on;
    if (!hoveredLink) return;
    hoveredLink.decorations.pointerCursor = on;
    hoveredLink.decorations.underline = on;
  }

  document.addEventListener("keydown", (e) => setMeta(e.metaKey), true);
  document.addEventListener("keyup", (e) => setMeta(e.metaKey), true);
  // Pencere odağı giderken ⌘'ın bırakıldığını göremiyoruz.
  window.addEventListener("blur", () => setMeta(false));

  const PATH_RE = /[~./]?[A-Za-z0-9_./-]*[A-Za-z0-9_-]\.[A-Za-z0-9_]{1,12}(?::\d+(?::\d+)?)?/g;
  const linkCache = new Map();    // paneID -> Map(aday -> var mı)
  const pendingProbe = new Map(); // istek no -> cevabı bekleyen fonksiyon
  let probeSeq = 0;

  // Sarılmış satırlar tek mantıksal satır sayılıyor: uzun bir yol satır sonunda
  // ikiye bölündüğünde de bütün olarak yakalansın. `translateToString(false)`
  // sağdaki boşlukları koruyor, böylece her parça tam `cols` karakter oluyor ve
  // karakter sırasını satır/sütuna çevirmek basit bölme işlemine iniyor.
  function logicalLine(term, index) {
    const buf = term.buffer.active;
    let start = index;
    while (start > 0) {
      const line = buf.getLine(start);
      if (!line || !line.isWrapped) break;
      start--;
    }
    let text = "";
    let at = start;
    for (;;) {
      const line = buf.getLine(at);
      if (!line) break;
      text += line.translateToString(false);
      const next = buf.getLine(at + 1);
      if (!next || !next.isWrapped) break;
      at++;
      if (at - start > 12) break;   // aşırı uzun sarmalarda tarama büyümesin
    }
    return { text: text, startY: start };
  }

  function scan(term, row) {
    const line = logicalLine(term, row - 1);
    if (!line.text) return [];
    const cols = term.cols;
    const out = [];
    PATH_RE.lastIndex = 0;
    let m;
    while ((m = PATH_RE.exec(line.text)) !== null) {
      const token = m[0];
      const parts = token.match(/^(.+?)(?::(\d+))?(?::(\d+))?$/);
      if (!parts) continue;
      const from = m.index, to = m.index + token.length - 1;
      out.push({
        token: token,
        path: parts[1],
        line: parts[2] ? parseInt(parts[2], 10) : 0,
        range: {
          start: { x: (from % cols) + 1, y: line.startY + Math.floor(from / cols) + 1 },
          end:   { x: (to % cols) + 1,   y: line.startY + Math.floor(to / cols) + 1 }
        }
      });
      if (out.length >= 24) break;   // tek satırda bundan fazlası zaten gürültü
    }
    return out;
  }

  // Uzun oturumda önbellek sınırsız büyümesin: tavanı aşınca en eski girdiler
  // düşüyor (Map ekleme sırasını koruyor). Düşen aday yeniden sorulur, o kadar.
  function trim(cache) {
    if (cache.size <= 4000) return;
    for (const key of cache.keys()) {
      cache.delete(key);
      if (cache.size <= 3000) break;
    }
  }

  function probePaths(paneID, tokens) {
    return new Promise(function (done) {
      let cache = linkCache.get(paneID);
      if (!cache) { cache = new Map(); linkCache.set(paneID, cache); }
      const ask = [];
      for (const t of tokens) if (!cache.has(t) && ask.indexOf(t) < 0) ask.push(t);
      if (!ask.length) { done(cache); return; }

      const req = ++probeSeq;
      // Cevap gelmezse (Swift tarafı meşgul/kapanıyor) söz askıda kalmasın:
      // link çizilmez, bir dahaki gezinişte yeniden sorulur.
      const timer = setTimeout(function () {
        pendingProbe.delete(req);
        done(cache);
      }, 2000);
      pendingProbe.set(req, function (results) {
        clearTimeout(timer);
        for (const t of ask) cache.set(t, results[t] === true);
        trim(cache);
        done(cache);
      });
      send("resolvePaths", { id: paneID, req: req, paths: ask });
    });
  }

  window.reeveResolved = function (req, results) {
    const fn = pendingProbe.get(req);
    if (!fn) return;
    pendingProbe.delete(req);
    fn(results || {});
  };

  // Oturum `cd` etti: göreli yollar artık başka bir klasöre işaret ediyor,
  // eski cevaplar çöp.
  window.reeveResetLinks = function (id) { linkCache.delete(id); };

  // ---- Swift → JS ----

  window.reeveCreate = function (id) {
    if (panes.has(id)) return;

    const el = document.createElement("div");
    el.className = "pane";
    el.dataset.active = "0";
    box(el, 0, 100 / Math.max(layout.length, 1));   // gizli pano da ölçülebilir olmalı
    host.appendChild(el);

    const inner = document.createElement("div");
    inner.className = "inner";
    el.appendChild(inner);

    const term = new Terminal(OPTIONS);
    const fit = new FitAddon.FitAddon();
    const search = new SearchAddon.SearchAddon();
    term.loadAddon(fit);
    term.loadAddon(search);
    term.open(inner);                       // eleman ölçülebilir: gizliyken de boyutu var

    term.registerLinkProvider({
      provideLinks: function (row, callback) {
        const found = scan(term, row);
        if (!found.length) { callback(undefined); return; }
        probePaths(id, found.map(f => f.token)).then(function (cache) {
          const links = [];
          for (const f of found) {
            if (cache.get(f.token) !== true) continue;
            const link = {
              range: f.range,
              text: f.token,
              decorations: { pointerCursor: metaHeld, underline: metaHeld },
              hover: function () { hoveredLink = link; },
              leave: function () { if (hoveredLink === link) hoveredLink = null; },
              activate: function (event) {
                if (event && !event.metaKey) return;   // tıklama terminalin
                send("openPath", { id: id, path: f.path, line: f.line });
              }
            };
            links.push(link);
          }
          callback(links.length ? links : undefined);
        });
      }
    });

    el.addEventListener("mousemove", (e) => setMeta(e.metaKey), true);
    el.addEventListener("mousedown", () => send("focusPane", { id: id }), true);
    term.onData(d => send("input", { id: id, b64: toB64(encoder.encode(d)) }));
    term.onBinary(d => {
      const u = new Uint8Array(d.length);
      for (let i = 0; i < d.length; i++) u[i] = d.charCodeAt(i) & 0xff;
      send("input", { id: id, b64: toB64(u) });
    });

    const rec = { term: term, fit: fit, search: search, el: el, inner: inner,
                  webgl: null, cols: 0, rows: 0 };
    panes.set(id, rec);

    fit.fit();
    rec.cols = term.cols;
    rec.rows = term.rows;
    send("created", { id: id, cols: rec.cols, rows: rec.rows });
  };

  // ---- panel yerleşimi ----
  // Panolar DOM'da taşınmıyor, sadece left/width değişiyor: canvas'ı yeniden
  // bağlamak WebGL bağlamını düşürürdü. Gizli panolar 0. slotun ölçüsünü alıyor,
  // görünür olduklarında zaten doğru boyutta oluyorlar (UI.md D9).
  function box(el, leftPercent, widthPercent) {
    const insetLeft = leftPercent > 0 ? 0.25 : 0;
    const insetRight = leftPercent + widthPercent < 99.999 ? 0.25 : 0;
    el.style.left = "calc(" + leftPercent + "% + " + insetLeft + "px)";
    el.style.width = "calc(" + widthPercent + "% - " + (insetLeft + insetRight) + "px)";
  }

  function place() {
    const share = 100 / Math.max(layout.length, 1);
    for (const [id, rec] of panes) {
      const at = Math.max(layout.indexOf(id), 0);
      box(rec.el, at * share, share);
    }
  }

  window.reeveLayout = function (slots) {
    layout = Array.isArray(slots) && slots.length ? slots : [null];
    for (const [id, rec] of panes) {
      const visible = layout.indexOf(id) >= 0;
      rec.el.dataset.active = visible ? "1" : "0";
      if (visible) { attachWebgl(rec); } else { detachWebgl(rec); }
    }
    place();
    syncAll();
  };

  window.reeveSelect = function (id) {
    const rec = panes.get(id);
    if (!rec) return;
    activeID = id;
    rec.fit.fit();
    reportSize(id, rec);
    rec.term.focus();
  };

  // ⌘F — görünür panolarda ara.
  window.reeveFind = function (query, forward) {
    for (const id of layout) {
      const rec = id && panes.get(id);
      if (!rec) continue;
      const found = forward
        ? rec.search.findNext(query)
        : rec.search.findPrevious(query);
      if (found && id === activeID) return;
    }
  };

  window.reeveClearFind = function () {
    for (const [, rec] of panes) rec.search.clearDecorations();
  };

  window.reeveDispose = function (id) {
    const rec = panes.get(id);
    if (!rec) return;
    detachWebgl(rec);
    rec.term.dispose();
    rec.el.remove();
    panes.delete(id);
    if (activeID === id) activeID = null;
  };

  window.reeveWrite = function (id, b64) {
    const rec = panes.get(id);
    if (rec) rec.term.write(fromB64(b64));
  };

  window.reeveFocus = function () {
    if (activeID && panes.has(activeID)) panes.get(activeID).term.focus();
  };

  // ---- boyut zinciri ----
  // Panolar hep aynı ölçüde (inset:0) ve gizli olanlar da ölçülebilir olduğu için
  // pencere boyu değişince HEPSİ yeniden fit edilir; her biri kendi ioctl'ini alır.
  const syncAll = () => {
    for (const [id, rec] of panes) {
      rec.fit.fit();
      reportSize(id, rec);
    }
  };
  new ResizeObserver(syncAll).observe(host);
  window.addEventListener("resize", syncAll);

  let probe = "dom";
  try {
    const canvas = document.createElement("canvas");
    probe = (canvas.getContext("webgl2") || canvas.getContext("webgl")) ? "webgl" : "dom";
  } catch (e) { probe = "dom"; }

  send("ready", { renderer: probe });
})();
</script>
</body>
</html>
